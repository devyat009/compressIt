name: Build & Release CompressIt

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test CompressIt.Tests\CompressIt.Tests.csproj --configuration Release --filter "Category!=Integration"

      - name: Build installer and portable release
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          .\scripts\build-release.ps1 -Version $tag

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CompressIt-Setup-v*.exe
            dist/CompressIt-win-x64-v*.zip
